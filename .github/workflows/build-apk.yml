name: Build ColorTales Kids APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Reassemble project
        run: |
          cat ColorTales.zip.part-* > ColorTales.zip
          unzip -q ColorTales.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ColorTales-Kids-Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorTales-Kids-APK
          path: ColorTales-Kids-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

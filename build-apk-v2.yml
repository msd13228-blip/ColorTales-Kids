name: Build Fixed ColorTales Kids APK v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Reassemble original project
        run: |
          cat ColorTales.zip.part-* > ColorTales.zip
          unzip -q ColorTales.zip
          unzip -qo ColorTales-Android-Fix-v2.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build fixed APK
        working-directory: ColorTales-Kids-Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorTales-Kids-APK-v2
          path: ColorTales-Kids-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
